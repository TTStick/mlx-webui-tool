<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLX UI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7b68'/%3E%3Cpath d='M8 22V10l8 8 8-8v12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/katex/katex.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // 在首屏渲染前应用主题，避免深色模式下闪白
    try {
      var saved = localStorage.getItem('mlxui-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="tip" role="tooltip"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>

[project]
name = "mlxui"
version = "1.0.0"
description = "本地 MLX 大模型聊天界面：对话管理、上下文与显存可视化、模型下载"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mlx>=0.26",
    "mlx-lm>=0.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=5.9",
    "huggingface_hub>=0.25",
    "pypdf>=4.0",
    "sqlcipher3-wheels>=0.5.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mlxui = "mlxui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlxui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
